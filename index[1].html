<title>Depot Sheet</title>
<style>
:root{--bg:#fff;--card:#fff;--ink:#111722;--mute:#5b6475;--line:#d9dee8;--soft:#f2f5fb;--blue:#1d43c4;--blue2:#1d43c4;--amber:#f5a30b;--green:#178a3d;--zero:#a9b0bd}
@media(prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181d24;--ink:#eef1f6;--mute:#9aa3b2;--line:#2c333e;--soft:#141920;--blue2:#7d97ff;--green:#3ccf72;--zero:#4d5563}}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 12px 0}
.top{display:flex;align-items:center;gap:8px}
h1{font-size:22px;margin:0;flex:1;font-weight:800;letter-spacing:-.2px}
.date{display:flex;gap:4px;align-items:center}
.date button{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.16);color:#fff;font-size:22px}
.date input{height:40px;border:0;border-radius:10px;padding:0 6px;background:#fff;color:#111722;font-size:16px;width:140px}
nav{display:flex;margin-top:6px}
nav button{flex:1;height:44px;color:#d7e0ff;font-weight:700;font-size:15px;border-bottom:4px solid transparent}
nav button.on{color:#fff;border-color:var(--amber)}
.stores{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;background:var(--soft);border-bottom:1px solid var(--line);position:sticky;top:var(--hh,98px);z-index:4}
.stores button{flex:none;min-width:84px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:18px;line-height:1.05}
.stores button small{display:block;font-size:12px;font-weight:600;color:var(--mute)}
.stores button.on{border-color:var(--blue);background:var(--blue);color:#fff}
.stores button.on small{color:#dfe6ff}
.tools{padding:10px 12px 4px;display:grid;gap:8px}
.search{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);padding:0 12px;background:var(--card);font-size:16px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;height:40px;font-weight:700;font-size:14px;color:var(--mute);background:var(--card)}
.seg button.on{background:var(--ink);color:var(--bg)}
.jump{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.jump button{flex:none;height:34px;padding:0 12px;border-radius:17px;background:var(--soft);border:1px solid var(--line);font-size:13px;font-weight:700}
.list{padding:0 12px}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.info{flex:1}
.code{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.nm{font-size:15px;font-weight:600}
.row.z .nm{font-weight:500;color:var(--mute)}
.st{width:46px;height:46px;border-radius:12px;font-size:26px;font-weight:700;background:var(--soft);border:1px solid var(--line);flex:none}
.st.p{background:var(--blue);border-color:var(--blue);color:#fff}
.q{width:54px;height:46px;border-radius:10px;border:2px solid var(--line);text-align:center;font-size:22px;font-weight:800;background:var(--card);flex:none}
.row:not(.z) .q{border-color:var(--amber)}
.row.z .q{color:var(--zero)}
.empty{padding:28px 12px;color:var(--mute);text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.bar .t{flex:1;line-height:1.1}.bar .t b{font-size:24px;display:block}.bar .t span{font-size:12px;color:var(--mute)}
.btn{height:48px;padding:0 14px;border-radius:12px;font-weight:800;font-size:15px;background:var(--soft);border:1px solid var(--line)}
.btn.blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.amber{background:var(--amber);color:#1b1400;border-color:var(--amber)}
.btn.red{color:#c62828;border-color:#c62828;background:var(--card)}
.btn.red.arm{background:#c62828;color:#fff}
.ent{display:flex;align-items:center;gap:12px;padding:14px 12px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.ent .chk{width:34px;height:34px;border-radius:9px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:22px;font-weight:900;color:#fff}
.ent .nm{font-size:18px;font-weight:700}
.ent .code{font-size:17px;font-weight:700;color:var(--blue2);letter-spacing:.5px}
.ent .big{font-size:40px;font-weight:900;min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.ent.done{opacity:.45}.ent.done .chk{background:var(--green);border-color:var(--green)}
.ent.done .nm{text-decoration:line-through}
.prog{padding:10px 12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.prog .pb{flex:1;height:10px;border-radius:5px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.prog .pb i{display:block;height:100%;background:var(--green)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:var(--hh,98px);background:var(--soft);font-size:12px;color:var(--mute)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
td.n.zz{color:var(--zero);font-weight:400}
.sec{padding:14px 12px}
.sec h2{font-size:18px;margin:0 0 8px}
.sec p{color:var(--mute);font-size:14px;margin:4px 0 10px}
.ed{display:flex;gap:6px;margin-bottom:6px}
.ed input{flex:1;height:44px;border-radius:10px;border:1px solid var(--line);padding:0 10px;background:var(--card);font-size:16px}
.ed button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--soft);flex:none}
textarea{width:100%;min-height:110px;border-radius:10px;border:1px solid var(--line);padding:8px;background:var(--card);font:13px ui-monospace,monospace}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-weight:700;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.hide{display:none!important}
</style></head><body>

const P=id=>S.products.find(p=>p.id===id);
function usualSet(s){const u=new Set();for(const d in S.days){const r=S.days[d][s];if(r)for(const p in r)u.add(p)}return u}
function setQ(s,p,n){n=Math.max(0,Math.min(999,parseInt(n,10)||0));const Dd=S.days[day]||(S.days[day]={});const r=Dd[s]||(Dd[s]={});if(n)r[p]=n;else delete r[p];if(!Object.keys(r).length)delete Dd[s];if(!Object.keys(Dd).length)delete S.days[day];save()}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600)}
const fmtDay=d=>new Date(d+'T12:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});

function renderStores(){
  const el=$('#stores');
  if(view==='totals'||view==='more'){el.classList.add('hide');return}
  el.classList.remove('hide');
  el.innerHTML=S.stores.map(s=>`<button data-s="${esc(s.id)}" class="${s.id===store?'on':''}">${esc(s.name)}<small>${stTotal(s.id)} ${stTotal(s.id)===1?'item':'items'}</small></button>`).join('');
}
function rowHTML(p){const n=qty(store,p.id);return `<div class="row${n?'':' z'}" data-p="${esc(p.id)}"><div class="info"><div class="code">${esc(p.code)}</div><div class="nm">${esc(p.name)}</div></div><button class="st" data-a="dec" aria-label="Less">−</button><input class="q" inputmode="numeric" pattern="[0-9]*" value="${n}" aria-label="Quantity ${esc(p.name)}"><button class="st p" data-a="inc" aria-label="More">+</button></div>`}
function listHTML(){
  const words=q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const us=filter==='usual'?usualSet(store):null;
  const items=S.products.filter(p=>{
    if(words.length&&!words.every(w=>(p.code+' '+p.name).toLowerCase().includes(w)))return false;
    if(filter==='counted')return qty(store,p.id)>0;
    if(filter==='usual')return us.has(p.id)||qty(store,p.id)>0;
    return true});
  return items.length?items.map(rowHTML).join(''):`<div class="empty">${filter==='usual'&&!words.length?'No usual items yet for this store. Once you count items here, they show up in Usual.':filter==='counted'&&!words.length?'Nothing counted for this store yet.':'No match.'}</div>`;
}
function loadView(){
  const pre=[...new Set(S.products.map(p=>p.name.split(' ')[0]))];
  return `<div class="tools"><input class="search" id="q" type="search" placeholder="Search code or name" value="${esc(q)}" autocomplete="off">
  <div class="seg">${[['all','All'],['usual','Usual'],['counted','Counted']].map(([k,l])=>`<button data-f="${k}" class="${filter===k?'on':''}">${l}</button>`).join('')}</div>
  <div class="jump${filter==='all'&&!q.trim()?'':' hide'}" id="jump">${pre.map(x=>`<button data-j="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>
  <div class="list" id="list">${listHTML()}</div>`;
}
function enterView(){
  const r=D()[store]||{};const ids=S.products.filter(p=>r[p.id]).map(p=>p.id);
  const dn=((S.done[day]||{})[store])||{};const k=ids.filter(i=>dn[i]).length;
  if(!ids.length)return `<div class="empty">Nothing counted for this store on ${esc(fmtDay(day))}.</div>`;
  const nm=S.stores.find(s=>s.id===store)?.name||'';
  return `<div class="prog"><span>Store ${esc(nm)}</span><div class="pb"><i style="width:${Math.round(k/ids.length*100)}%"></i></div><span>${k}/${ids.length}</span></div>`+
  ids.map(id=>{const p=P(id);return `<button class="ent${dn[id]?' done':''}" data-e="${esc(id)}"><span class="chk">${dn[id]?'✓':''}</span><span class="info"><span class="code">${esc(p.code)}</span><br><span class="nm">${esc(p.name)}</span></span><span class="big">${r[id]}</span></button>`}).join('');
}
function totalsView(){
  const rows=S.products.filter(p=>S.stores.some(s=>qty(s.id,p.id)));
  if(!rows.length)return `<div class="empty">Nothing counted on ${esc(fmtDay(day))}.</div>`;
  return `<div class="sec" style="padding-bottom:0"><h2>Pull list · ${esc(fmtDay(day))}</h2><p>Everything to grab, split by store.</p></div><div style="overflow-x:auto;padding:0 6px"><table><thead><tr><th>Item</th>${S.stores.map(s=>`<th class="n">${esc(s.name)}</th>`).join('')}<th class="n">All</th></tr></thead><tbody>`+
  rows.map(p=>{const per=S.stores.map(s=>qty(s.id,p.id));return `<tr><td><div class="code">${esc(p.code)}</div>${esc(p.name)}</td>${per.map(n=>`<td class="n${n?'':' zz'}">${n||'·'}</td>`).join('')}<td class="n">${per.reduce((a,b)=>a+b,0)}</td></tr>`}).join('')+
  `<tr><td><b>Total</b></td>${S.stores.map(s=>`<td class="n">${stTotal(s.id)}</td>`).join('')}<td class="n">${grand()}</td></tr></tbody></table></div>`;
}
function moreView(){
  return `<div class="sec"><h2>Backup</h2><p>Everything is saved on this phone only. Copy a backup now and then (paste it in Notes or text it to yourself) so a lost phone doesn't lose your history.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn blue" data-m="backup">Copy backup</button><button class="btn" data-m="showrestore">Restore…</button></div>
  <div id="restore" class="hide" style="margin-top:10px"><textarea id="rtext" placeholder="Paste a backup here"></textarea><button class="btn amber" data-m="restore" style="margin-top:8px">Restore this backup</button></div></div>
  <div class="sec"><h2>Stores</h2><p>In route order.</p>${S.stores.map((s,i)=>`<div class="ed"><input data-sn="${i}" value="${esc(s.name)}"><button data-m="sup" data-i="${i}">↑</button><button data-m="sdel" data-i="${i}" style="color:#c62828">${armed==='s'+i?'?':'✕'}</button></div>`).join('')}
  <div class="ed"><input id="newstore" placeholder="New store number" inputmode="numeric"><button data-m="sadd" style="width:auto;padding:0 14px;font-weight:700">Add</button></div></div>
  <div class="sec"><h2>Add a product</h2><p>For anything new on the handheld. It's added at the end of the list.</p>
  <div class="ed"><input id="npc" placeholder="Code" inputmode="numeric" style="flex:0 0 100px"><input id="npn" placeholder="Name"></div><button class="btn" data-m="padd">Add product</button></div>
  <div class="sec"><h2>Fix a product</h2><p>Search, then edit the code or name. Two codes I couldn't read from your video are marked “?”.</p><input class="search" id="fixq" placeholder="Search to edit" autocomplete="off"><div id="fixlist" style="margin-top:8px"></div></div>
  <div class="sec"><h2>This day</h2><button class="btn red${armed==='clear'?' arm':''}" data-m="clear">${armed==='clear'?'Tap again to clear '+esc(fmtDay(day)):'Clear all counts for '+esc(fmtDay(day))}</button></div>`;
}
function fixList(){const w=($('#fixq')?.value||'').toLowerCase().trim();const el=$('#fixlist');if(!el)return;
  const items=w?S.products.filter(p=>(p.code+' '+p.name).toLowerCase().includes(w)).slice(0,20):S.products.filter(p=>p.code==='?');
  el.innerHTML=items.map(p=>`<div class="ed"><input data-pc="${esc(p.id)}" value="${esc(p.code)}" style="flex:0 0 100px" inputmode="numeric"><input data-pn="${esc(p.id)}" value="${esc(p.name)}"></div>`).join('')}

function bar(){
  const b=$('#bar');
  if(view==='load')b.innerHTML=`<div class="t"><b>${stTotal(store)}</b><span>this store · ${grand()} all stores</span></div><button class="btn" data-b="last">Same as last</button><button class="btn amber" data-b="copy">Copy</button>`;
  else if(view==='enter'){const i=S.stores.findIndex(s=>s.id===store);b.innerHTML=`<div class="t"><b>${lines(store)} lines</b><span>${stTotal(store)} items</span></div><button class="btn" data-b="reset">Uncheck all</button><button class="btn blue" data-b="nextstore">${i<S.stores.length-1?'Next store →':'Done'}</button>`}
  else if(view==='totals')b.innerHTML=`<div class="t"><b>${grand()}</b><span>items today</span></div><button class="btn amber" data-b="copy">Copy all</button>`;
  else b.innerHTML=`<div class="t"><b>Saved on phone</b><span>Works with no signal</span></div>`;
}
function render(keepScroll){
  $('#day').value=day;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  if(!S.stores.find(s=>s.id===store))store=S.stores[0]?.id;
  renderStores();
  const y=scrollY;
  $('#main').innerHTML=view==='load'?loadView():view==='enter'?enterView():view==='totals'?totalsView():moreView();
  if(view==='more')fixList();
  bar();remember();
  if(keepScroll)scrollTo(0,y);
}
function updateRow(pid){const r=document.querySelector(`.row[data-p="${CSS.escape(pid)}"]`);if(r){const n=qty(store,pid);r.classList.toggle('z',!n);const i=r.querySelector('.q');if(document.activeElement!==i)i.value=n}renderStores();bar()}

function text(only){
  let t='Depot · '+fmtDay(day)+'\n';
  S.stores.forEach(s=>{if(only&&s.id!==only)return;const r=D()[s.id];if(!r)return;t+='\nSTORE '+s.name+'\n';S.products.forEach(p=>{if(r[p.id])t+=p.code+'  '+p.name+'  x'+r[p.id]+'\n'});t+='Total: '+stTotal(s.id)+'\n'});
  return t;
}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copied')}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copied')}catch(_){toast('Copy failed')}a.remove()}}

// events
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;view=b.dataset.v;armed=null;render();scrollTo(0,0)});
$('#stores').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;store=b.dataset.s;render();scrollTo(0,0)});
$('#day').addEventListener('change',e=>{if(e.target.value){day=e.target.value;armed=null;render()}});
const shift=n=>{const d=new Date(day+'T12:00');d.setDate(d.getDate()+n);day=iso(d);armed=null;render()};
$('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);
$('#main').addEventListener('click',e=>{
  const t=e.target;
  const st=t.closest('.st');if(st){const pid=st.closest('.row').dataset.p;setQ(store,pid,qty(store,pid)+(st.dataset.a==='inc'?1:-1));updateRow(pid);return}
  const f=t.closest('[data-f]');if(f){filter=f.dataset.f;render();return}
  const j=t.closest('[data-j]');if(j){const p=S.products.find(p=>p.name.split(' ')[0]===j.dataset.j);const r=p&&document.querySelector(`.row[data-p="${CSS.escape(p.id)}"]`);if(r)scrollTo({top:r.getBoundingClientRect().top+scrollY-230,behavior:'smooth'});return}
  const en=t.closest('[data-e]');if(en){const dd=S.done[day]||(S.done[day]={});const ds=dd[store]||(dd[store]={});ds[en.dataset.e]=!ds[en.dataset.e];save();render(true);return}
  const m=t.closest('[data-m]');if(!m)return;const a=m.dataset.m,i=+m.dataset.i;
  if(a!=='clear'&&a!=='sdel')armed=null;
  if(a==='backup')copy(JSON.stringify(S));
  else if(a==='showrestore')$('#restore').classList.toggle('hide');
  else if(a==='restore'){try{const n=JSON.parse($('#rtext').value);if(!n.products||!n.stores||!n.days)throw 0;S=n;S.done=S.done||{};save();toast('Backup restored');render()}catch(_){toast('That isn\'t a valid backup')}}
  else if(a==='sup'&&i>0){[S.stores[i-1],S.stores[i]]=[S.stores[i],S.stores[i-1]];save();render(true)}
  else if(a==='sdel'){if(armed==='s'+i){S.stores.splice(i,1);armed=null;save()}else armed='s'+i;render(true)}
  else if(a==='sadd'){const v=$('#newstore').value.trim();if(v){S.stores.push({id:'s'+Date.now().toString(36),name:v});save();render(true)}}
  else if(a==='padd'){const c=$('#npc').value.trim(),n=$('#npn').value.trim();if(!n){toast('Add a name');return}S.products.push({id:'u'+Date.now().toString(36),code:c||'?',name:n.toUpperCase()});save();toast('Added');render(true)}
  else if(a==='clear'){if(armed==='clear'){delete S.days[day];delete S.done[day];armed=null;save();toast('Day cleared')}else armed='clear';render(true)}
});
$('#main').addEventListener('focusin',e=>{if(e.target.classList.contains('q'))setTimeout(()=>e.target.select(),0)});
$('#main').addEventListener('change',e=>{const t=e.target;
  if(t.classList.contains('q')){const pid=t.closest('.row').dataset.p;setQ(store,pid,t.value);t.value=qty(store,pid);updateRow(pid)}
  else if(t.dataset.sn!==undefined){const v=t.value.trim();if(v){S.stores[+t.dataset.sn].name=v;save();renderStores()}}
  else if(t.dataset.pc){const p=P(t.dataset.pc);if(p){p.code=t.value.trim()||'?';save();toast('Saved')}}
  else if(t.dataset.pn){const p=P(t.dataset.pn);if(p&&t.value.trim()){p.name=t.value.trim();save();toast('Saved')}}
});
$('#main').addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;$('#list').innerHTML=listHTML();$('#jump').classList.toggle('hide',!(filter==='all'&&!q.trim()))}else if(e.target.id==='fixq')fixList()});
$('#bar').addEventListener('click',e=>{const b=e.target.closest('[data-b]');if(!b)return;const a=b.dataset.b;
  if(a==='copy')copy(view==='totals'?text():text(store));
  else if(a==='last'){const prev=Object.keys(S.days).filter(d=>d<day&&S.days[d][store]).sort().pop();if(!prev){toast('No earlier day for this store');return}const Dd=S.days[day]||(S.days[day]={});Dd[store]={...S.days[prev][store]};save();toast('Copied from '+fmtDay(prev));render(true)}
  else if(a==='reset'){if(S.done[day])delete S.done[day][store];save();render(true)}
  else if(a==='nextstore'){const i=S.stores.findIndex(s=>s.id===store);if(i<S.stores.length-1){store=S.stores[i+1].id;render();scrollTo(0,0)}else toast('All stores done')}
});
const hdr=document.querySelector('header');const setH=()=>document.documentElement.style.setProperty('--hh',hdr.offsetHeight+'px');new ResizeObserver(setH).observe(hdr);setH();
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body></html>
